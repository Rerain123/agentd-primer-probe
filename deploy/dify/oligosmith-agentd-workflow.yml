        {
          "data": {
            "author": "OligoSmith",
            "desc": "",
            "height": 850,
            "selected": false,
            "showAuthor": false,
            "text": "# WF-02 普通多重流程（N01–N32）\n\n## 阶段 1 · N01–N05 需求识别与建单\n`WF02_PREFLIGHT → WF02_CREATE`；缺项保留草稿，使用 `DRAFT_STATUS / DRAFT_RESPOND` 补全。\n\n## 阶段 2 · N06–N09 单靶标候选\n逐靶标执行最新 WF-01 候选生成；0 套时记录 FAIL 和覆盖缺口并继续，其余保留通过 P6/特异性校验的 Top 5。\n\n## 阶段 3 · 组合与冲突处理\n组合候选、调用 **P5 工具组合**评价互作/冲突；P5 直接作为工具包调用。现阶段采用保守、易调整的冲突处置阈值。\n\n## 阶段 4 · 多重体系设计\n结合默认仪器约束、通道/染料、扩增子和引物探针兼容性生成可执行 panel。\n\n## 阶段 5 · 验证与回退\n按流程状态运行，遇到靶标级问题用 `TARGET_RESPOND`，内标问题用 `INTERNAL_RESPOND`；失败原因和回退证据必须保留。\n\n## 阶段 6 · 报告与交付\n`REPORT → PANEL → VERSION → EXPORT`；报告由 AgentD 调用现有报告生成链路完成，Dify 不拼装科研结论。\n\n`WF02_RUN` 每次推进到完成或阻塞点，通过 `WF02_STATUS` 检查当前节点。",
            "theme": "blue",
            "title": "",
            "type": ""
          },
          "height": 850,
          "id": "note_wf02",
          "position": {
            "x": 690,
            "y": 650
