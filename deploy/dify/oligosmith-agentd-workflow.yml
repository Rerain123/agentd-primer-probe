        {
          "data": {
            "author": "OligoSmith",
            "desc": "",
            "height": 850,
            "selected": false,
            "showAuthor": false,
            "text": "# 冲突与工具边界验收清单\n\n## 必须保持的边界\n\n- **P1–P6 是独立工具包**：WF-02 只能调用，不能在编排代码里重新实现算法。\n- **P5 是多工具组合**：WF-02 直接调用 P5 的公共入口，不回到旧 WF-03 编排。\n- **P6 证据归属**：WF-02 只保存自己的证据快照，不改写 WF-01 结果。\n- **候选来源**：WF-02 阶段 2 复用最新 WF-01 公共服务，不参考旧 WF-01 v0.2。\n- **默认仪器**：用户未指定时采用当前默认仪器；后续专家确认后只改规则/配置。\n- **0 候选不中断批次**：标记该靶标 FAIL、记录原因，继续处理其余靶标。\n- **人工确认可恢复**：DRAFT / TARGET / INTERNAL_CONTROL 三类交互必须能提交后继续运行。\n- **报告单一来源**：报告、版本、导出均由 AgentD 生成。\n\n## 本工作流如何发现问题\n\n1. 输入校验失败：说明接口前置条件不完整。\n2. HTTP 4xx：说明节点与 API 契约不一致或状态不允许。\n3. HTTP 409：说明流程状态/版本冲突。\n4. HTTP 5xx：说明工具链或后端执行异常。\n5. 返回 blocked：读取交互项，补充后再次 RUN。\n\n每次执行均保留 `operation + status_code + response_body`，可直接对照 HTML 流程节点核验。",
