        {
          "data": {
            "code": "import json\n\nROUTES = {\n    \"WF01_PREFLIGHT\": (\"POST\", \"/v1/wf01/tasks/preflight\"),\n    \"WF01_CREATE\": (\"POST\", \"/v1/wf01/tasks\"),\n    \"WF01_STATUS\": (\"GET\", \"/v1/wf01/tasks/{batch_id}\"),\n    \"WF01_REVISE_TARGETS\": (\"PATCH\", \"/v1/wf01/tasks/{batch_id}/targets\"),\n    \"WF01_CONFIRM\": (\"POST\", \"/v1/wf01/tasks/{batch_id}/confirm\"),\n    \"WF01_RUN\": (\"POST\", \"/v1/wf01/tasks/{batch_id}/run-until-blocked\"),\n    \"WF01_RUN_M2\": (\"POST\", \"/v1/wf01/tasks/{batch_id}/run-m2\"),\n    \"WF01_RUN_M3\": (\"POST\", \"/v1/wf01/tasks/{batch_id}/run-m3\"),\n    \"WF01_RUN_M4\": (\"POST\", \"/v1/wf01/tasks/{batch_id}/run-m4\"),\n    \"WF01_RUN_M5\": (\"POST\", \"/v1/wf01/tasks/{batch_id}/run-m5\"),\n    \"WF01_RUN_M6\": (\"POST\", \"/v1/wf01/tasks/{batch_id}/run-m6\"),\n    \"WF01_INTERACTIONS\": (\"GET\", \"/v1/wf01/tasks/{batch_id}/interactions\"),\n    \"WF01_RESPOND\": (\"POST\", \"/v1/wf01/tasks/{batch_id}/interactions/response\"),\n    \"WF01_REPORT\": (\"GET\", \"/v1/wf01/tasks/{batch_id}/report\"),\n    \"WF01_VERSION\": (\"POST\", \"/v1/wf01/tasks/{batch_id}/versions\"),\n    \"WF01_EXPORT\": (\"GET\", \"/v1/wf01/tasks/{batch_id}/exports/{format_name}\"),\n    \"WF02_PREFLIGHT\": (\"POST\", \"/v1/wf02/tasks/preflight\"),\n    \"WF02_CREATE\": (\"POST\", \"/v1/wf02/tasks\"),\n    \"WF02_DRAFT_STATUS\": (\"GET\", \"/v1/wf02/drafts/{draft_id}\"),\n    \"WF02_DRAFT_RESPOND\": (\"POST\", \"/v1/wf02/drafts/{draft_id}/interactions/response\"),\n    \"WF02_STATUS\": (\"GET\", \"/v1/wf02/tasks/{batch_id}\"),\n    \"WF02_RUN\": (\"POST\", \"/v1/wf02/tasks/{batch_id}/run-until-blocked\"),\n    \"WF02_TARGET_RESPOND\": (\"POST\", \"/v1/wf02/tasks/{batch_id}/targets/{target_id}/interactions/response\"),\n    \"WF02_INTERNAL_RESPOND\": (\"POST\", \"/v1/wf02/tasks/{batch_id}/internal-control/interactions/response\"),\n    \"WF02_REPORT\": (\"GET\", \"/v1/wf02/tasks/{batch_id}/report\"),\n    \"WF02_PANEL\": (\"GET\", \"/v1/wf02/tasks/{batch_id}/panels/{panel_id}\"),\n    \"WF02_VERSION\": (\"POST\", \"/v1/wf02/tasks/{batch_id}/versions\"),\n    \"WF02_EXPORT\": (\"GET\", \"/v1/wf02/tasks/{batch_id}/exports/{format_name}\"),\n}\n\nBATCH_FREE = {\n    \"WF01_PREFLIGHT\", \"WF01_CREATE\", \"WF02_PREFLIGHT\", \"WF02_CREATE\",\n    \"WF02_DRAFT_STATUS\", \"WF02_DRAFT_RESPOND\",\n}\nDRAFT_REQUIRED = {\"WF02_DRAFT_STATUS\", \"WF02_DRAFT_RESPOND\"}\nTARGET_REQUIRED = {\"WF02_TARGET_RESPOND\"}\nPANEL_REQUIRED = {\"WF02_PANEL\"}\n\ndef main(operation, payload_json, batch_id, draft_id, target_id, panel_id, format_name, base_url):\n    operation = (operation or \"\").strip()\n    batch_id = (batch_id or \"\").strip()\n    draft_id = (draft_id or \"\").strip()\n    target_id = (target_id or \"\").strip()\n    panel_id = (panel_id or \"\").strip()\n    format_name = (format_name or \"\").strip().lower()\n    base_url = (base_url or \"\").strip().rstrip(\"/\")\n    errors = []\n\n    if operation not in ROUTES:\n        errors.append(\"未知 operation\")\n    if not base_url:\n        errors.append(\"AGENTD_BASE_URL 不能为空\")\n    if operation not in BATCH_FREE and not batch_id:\n        errors.append(\"该操作需要 batch_id\")\n    if operation in DRAFT_REQUIRED and not draft_id:\n        errors.append(\"该操作需要 draft_id\")\n    if operation in TARGET_REQUIRED and not target_id:\n        errors.append(\"该操作需要 target_id\")\n    if operation in PANEL_REQUIRED and not panel_id:\n        errors.append(\"该操作需要 panel_id\")\n    if operation == \"WF01_EXPORT\" and format_name not in {\"html\", \"process_html\", \"rules_html\", \"scientific_data\", \"csv\", \"pdf\"}:\n        errors.append(\"WF01_EXPORT 的 format_name 必须为 html/process_html/rules_html/scientific_data/csv/pdf\")\n    if operation == \"WF02_EXPORT\" and format_name not in {\"html\", \"csv\", \"pdf\"}:\n        errors.append(\"WF02_EXPORT 的 format_name 必须为 html/csv/pdf\")\n\n    raw_payload = (payload_json or \"{}\").strip() or \"{}\"\n    try:\n        payload = json.loads(raw_payload)\n        if not isinstance(payload, dict):\n            errors.append(\"payload_json 必须是 JSON 对象\")\n            payload = {}\n    except Exception as exc:\n        errors.append(\"payload_json 不是合法 JSON：\" + str(exc))\n        payload = {}\n\n    method, path = ROUTES.get(operation, (\"GET\", \"/__invalid_operation__\"))\n    try:\n        path = path.format(\n            batch_id=batch_id, draft_id=draft_id, target_id=target_id,\n            panel_id=panel_id, format_name=format_name,\n        )\n    except Exception as exc:\n        errors.append(\"路径参数生成失败：\" + str(exc))\n\n    validation_error = \"；\".join(errors)\n    error_body = json.dumps({\n        \"ok\": False,\n        \"operation\": operation,\n        \"validation_error\": validation_error,\n    }, ensure_ascii=False)\n    return {\n        \"operation\": operation,\n        \"method\": method,\n        \"request_url\": base_url + path,\n        \"body_json\": json.dumps(payload, ensure_ascii=False),\n        \"validation_error\": validation_error,\n        \"error_body\": error_body,\n        \"error_status\": 400,\n    }",
            "code_language": "python3",
            "desc": "验证 JSON、必填 ID、导出格式，并映射为固定 REST 路由。",
