            "height": 320,
            "selected": false,
            "showAuthor": false,
        "text": "# OligoSmith 确定性流程验证台（无 LLM）\n\n**用途**：验证 WF-01 / WF-02 能否跑通、节点约束是否冲突、接口和工具调用边界是否合理。\n\n- Dify 只做显式操作选择、输入校验、HTTP 调用、状态码与结果展示。\n- 不包含 LLM、Agent、模型驱动的函数调用、模型 Provider 或 Marketplace 插件。\n- 科学计算仍在 AgentD 内完成；P1–P6 不复制进 DSL。\n- REST 与 MCP 最终进入同一个 `AgentDService`。本验证台用 REST，是为了消除 MCP Provider 名称和插件安装对流程验收的干扰。\n- 生产对话入口后续仍可使用“大模型 + MCP”；它与本确定性验收工作流是两个展示层。",
            "theme": "blue",
