        {
          "data": {
            "author": "OligoSmith",
            "desc": "",
            "height": 590,
            "selected": false,
            "showAuthor": false,
            "text": "# WF-01 单靶标流程（已完成，回归基线）\n\n1. **M1** 预检与建单：`PREFLIGHT → CREATE → STATUS`\n2. **M2** 生成与规则执行：`REVISE_TARGETS → CONFIRM → RUN_M2`\n3. **M3** 去重与预排序：`RUN_M3`\n4. **外部 Step 5 / 后端 M4** 完整路线执行与最终排序：`RUN_M4`\n5. **后端 M5** 状态汇总：`RUN_M5`\n6. **后端 M6** canonical report 与导出准备：`RUN_M6`\n7. **M7** 版本化重设计：`VERSION`；读取与导出使用 `REPORT / EXPORT`\n\n外部 Step 编号与后端 M 编号不是一一对应关系。当前标准路线不包含外部 Step 4；外部 Step 5 对应后端 M4，不要把 `RUN_M5` 标成外部 Step 5。\n\n`WF01_RUN` 可按状态推进到下一个阻塞点；出现人工确认时使用 `INTERACTIONS / RESPOND`。\n\n**WF-02 复用边界**：第二阶段逐靶标调用 WF-01 公共服务生成候选，不复制 WF-01 的内部规则，也不修改 WF-01 已有流程。",
